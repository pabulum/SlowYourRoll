name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to main, but only after CI
# passes. In the repo settings, set Pages → Build and deployment → Source to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on lint + typecheck + test, so main is never published red.
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # There's no build step — "building" is copying the files the browser actually
      # loads. Everything else (tests, scripts, tooling config) stays off the site.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html LICENSE og.png _site/
          cp -r src data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
